plugins {
    id 'com.android.application'
}

android {
    namespace 'com.axlsystem.axlsdk.sample'
    compileSdk 34

    defaultConfig {
        applicationId 'com.axlsystem.axlsdk.sample'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // ── Option A (default): reference the SDK module directly during development
    // usb-serial-for-android is pulled in transitively — no extra declaration needed
    implementation project(':axlsdk')

    // ── Option B: use the built AAR (after ./gradlew :axlsdk:assembleRelease)
    // Requires JitPack in repositories and explicit usb-serial declaration:
    //   maven { url = uri("https://jitpack.io") }
    // implementation files('../axlsdk/build/outputs/aar/axlsdk-release.aar')
    // implementation 'com.github.mik3y:usb-serial-for-android:3.9.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
